services:
  - type: web
    name: speech-analysis-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: XAI_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
    healthCheckPath: /health
