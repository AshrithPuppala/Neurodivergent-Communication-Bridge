services:
  - type: web
    name: speech-analysis-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: XAI_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
    healthCheckPath: /health
